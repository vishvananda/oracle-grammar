[package]
name = "oracle-ir"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Portable typed card semantics owned by Oracle Grammar"

[features]
default = []
typescript = ["dep:ts-rs"]

[dependencies]
ts-rs = { version = "10.1", features = ["no-serde-warnings"], optional = true }
serde = { version = "1", features = ["derive"] }
bincode = "2.0.1"
syn = { version = "2", features = ["full"] }

[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "forbid"
too_many_arguments = "forbid"
