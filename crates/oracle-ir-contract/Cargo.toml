[package]
name = "oracle-ir-contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/vishvananda/oracle-grammar"
readme = "README.md"
include = ["src/**", "schema/**", "rewrites/**", "build.rs", "Cargo.toml", "README.md", "LICENSE"]
autotests = false
license = "MIT"
description = "Validation, canonicalization and binding contracts for Oracle IR"

[dependencies]
oracle-ir = { path = "../oracle-ir", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
ron = "0.8.1"
bincode = "2.0.1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["unbounded_depth", "preserve_order"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "forbid"
too_many_arguments = "forbid"
