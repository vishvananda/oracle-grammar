name: Release grammar
on:
  push:
    tags: ['grammar-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Code tag matching Cargo version (grammar-v0.1.0)
        required: true
        type: string
      publish:
        description: Publish verified crates and GitHub release (requires trusted publishing)
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: grammar-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: python3 tools/pin.py check
      - run: python3 tools/hygiene.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/dev.py test
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Verify and package release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: python3 tools/releases.py code --tag "$RELEASE_TAG" --out .cache/release-code
      - uses: actions/upload-artifact@v4
        with:
          name: grammar-code
          path: .cache/release-code/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: prepare
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: grammar-code
          path: .cache/release-code
      - name: Check bootstrap credential
        id: bootstrap
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: |
          if [ -n "$BOOTSTRAP_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.bootstrap.outputs.available != 'true'
        id: auth
      - name: Publish exact verified packages in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
        run: python3 tools/releases.py publish-crates .cache/release-code
      - name: Upload, verify and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 tools/releases.py github .cache/release-code --repo "$RELEASE_REPOSITORY" --publish
