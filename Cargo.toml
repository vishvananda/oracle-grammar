[package]
name = "oracle-ir-grammar"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Phrase-level Oracle grammar over its owned rules IR"
autobins = false
autotests = false
repository = "https://github.com/vishvananda/oracle-grammar"
readme = "README.md"
include = ["/src/**", "/grammar/**", "/tests/**", "/families/**", "/pins/model.json", "/Cargo.toml", "/Cargo.lock", "/README.md", "/docs/releases.md", "/docs/grammar-release-plan.md", "/releases/README.md", "/LICENSE-*"]

[lib]
# There are no Rust documentation examples to test. Keep the ordinary test
# command to one executable instead of building a second library for rustdoc.
doctest = false

[features]
default = []
# Diagnostics are explicit: ordinary library tests do not link every CLI.
cli = []
# Portable binaries embed syntax; development keeps runtime grammar edits.
embedded-grammar = []
# Keep allocation instrumentation separate from timing builds.
allocation-profile = ["cli", "dep:stats_alloc"]

[[bin]]
name = "native-export"
path = "src/bin/native-export.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "inspect"
path = "src/bin/inspect.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "family-check"
path = "src/bin/family-check.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "grammar-export"
path = "src/bin/grammar-export.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "score"
path = "src/bin/score.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "rule-audit"
path = "src/bin/rule-audit.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "perturb"
path = "src/bin/perturb.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "perf"
path = "src/bin/perf.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "allocations"
path = "src/bin/allocations.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "validate-readings"
path = "src/bin/validate-readings.rs"
test = false
bench = false
required-features = ["cli"]

[dependencies]
oracle-ir = { path = "crates/oracle-ir", version = "0.2.0" }
oracle-ir-contract = { path = "crates/oracle-ir-contract", version = "0.2.0" }
tabnas-ebnf = "=0.1.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8.1"
syn = { version = "2", features = ["full"] }
rustc-hash = "2.1.3"
smallvec = "1"
stats_alloc = { version = "=0.1.10", optional = true }

# Frozen source/IR type packages retain expensive serialization derives. Pin
# them independently, disable source lowering, and reuse their opt-level 1 builds.
# Correctness uses one reusable frontend configuration; performance builds
# explicitly override this package to opt-level 3.
# Test and diagnostic loops repeatedly load the full grammar. Optimize the
# frontend in dev/test without rebuilding upstream packages at another level.
[profile.dev.package.oracle-ir-grammar]
opt-level = 1

[profile.release.package.oracle-ir-grammar]
opt-level = 1

[profile.release.package.oracle-ir]
opt-level = 1

[profile.release.package.oracle-ir-contract]
opt-level = 1


[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "forbid"
too_many_arguments = "forbid"

[workspace]
members = ["crates/oracle-ir", "crates/oracle-ir-contract"]
default-members = [".", "crates/oracle-ir", "crates/oracle-ir-contract"]
resolver = "2"
