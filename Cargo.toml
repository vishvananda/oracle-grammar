[package]
name = "oracle-ir-grammar"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Phrase-level Oracle grammar over MTGish's normalized IR"
publish = false
autobins = false
repository = "https://github.com/vishvananda/oracle-grammar"
readme = "README.md"

[features]
default = []
# Diagnostics are explicit: ordinary library tests do not link every CLI.
cli = []
validation-audit = ["cli"]
# Keep allocation instrumentation separate from timing builds.
allocation-profile = ["cli", "dep:stats_alloc"]

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "inspect"
path = "src/bin/inspect.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "family-check"
path = "src/bin/family-check.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "grammar-export"
path = "src/bin/grammar-export.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "score"
path = "src/bin/score.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "rule-audit"
path = "src/bin/rule-audit.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "perturb"
path = "src/bin/perturb.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "perf"
path = "src/bin/perf.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "allocations"
path = "src/bin/allocations.rs"
test = false
bench = false
required-features = ["cli"]

[[bin]]
name = "validate-readings"
path = "src/bin/validate-readings.rs"
test = false
bench = false
required-features = ["validation-audit"]

[dependencies]
mtgish-ast = { git = "https://github.com/vishvananda/mtgish.git", rev = "a2914e01da6515e3bbd855a4b5c5282b0bfe4d8b", default-features = false }
tabnas-ebnf = "=0.1.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8.1"
syn = { version = "2", features = ["full"] }
rustc-hash = "2.1.3"
smallvec = "1"
stats_alloc = { version = "=0.1.10", optional = true }

# Frozen source/IR type packages retain expensive serialization derives. Pin
# them independently, disable source lowering, and reuse their opt-level 1 builds.
# Correctness uses one reusable frontend configuration; performance builds
# explicitly override this package to opt-level 3.
# Tests repeatedly load the full grammar; optimize the frontend without
# rebuilding the large upstream dependencies at another optimization level.
[profile.test.package.oracle-ir-grammar]
opt-level = 1

[profile.release.package.oracle-ir-grammar]
opt-level = 1

[profile.release.package.mtgish-ir]
opt-level = 1

[profile.release.package.mtgish-ast]
opt-level = 1

[profile.release.package.rust_syntax]
opt-level = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "forbid"
too_many_arguments = "forbid"

[workspace]
